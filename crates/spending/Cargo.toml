[package]
name = "wealthfolio-spending"
version.workspace = true
edition.workspace = true
description = "Cash-account spending, categorization, rules, events, budget, and analytics for Wealthfolio"
authors = ["Aziz Fadil"]
license = "AGPL-3.0"
repository = "https://github.com/afadil/wealthfolio"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
chrono-tz = "0.10"
thiserror = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
async-trait = { workspace = true }
log = { workspace = true }
rust_decimal = { workspace = true }
regex = "1"

image = { version = "0.25", optional = true, default-features = false, features = ["jpeg", "png", "webp"] }
pdfium-render = { version = "0.9", optional = true, default-features = false, features = ["pdfium_7881", "image_latest", "thread_safe"] }

# Sibling crate
wealthfolio-core = { path = "../core" }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
proptest = "1.4"

[lints]
workspace = true

[features]
attachments = ["dep:image", "dep:pdfium-render", "tokio/fs", "tokio/rt", "tokio/sync"]
